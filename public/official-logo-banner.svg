<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <!-- Top curved text path for emblem -->
    <path id="emblemTopPath" d="M 330 110 A 70 70 0 0 1 470 110" fill="none" />
    <!-- Bottom curved text path for emblem -->
    <path id="emblemBottomPath" d="M 466 110 A 66 66 0 0 1 334 110" fill="none" />
  </defs>

  <!-- Clean Background -->
  <rect width="800" height="450" fill="#FFFFFF" />

  <!-- 1. TOP CIRCULAR SEAL EMBLEM -->
  <g id="circular-seal">
    <!-- Concentric Circles -->
    <circle cx="400" cy="110" r="92" stroke="#0077b6" stroke-width="2.5" fill="none" />
    <circle cx="400" cy="110" r="88" stroke="#0077b6" stroke-width="1.2" fill="none" />
    <circle cx="400" cy="110" r="60" stroke="#0077b6" stroke-width="1.2" fill="none" />

    <!-- Top Text: KALA SAMSKARIKA VEDI -->
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9.5" font-weight="800" fill="#0077b6" letter-spacing="2.2">
      <textPath href="#emblemTopPath" startOffset="50%" text-anchor="middle">
        KALA SAMSKARIKA VEDI
      </textPath>
    </text>

    <!-- Bottom Text: PUTHUPONNANI -->
    <text font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="9.5" font-weight="800" fill="#0077b6" letter-spacing="2.5">
      <textPath href="#emblemBottomPath" startOffset="50%" text-anchor="middle">
        PUTHUPONNANI
      </textPath>
    </text>

    <!-- Center Torch and Flames -->
    <!-- Central flame -->
    <path d="M 400 68 C 395 77 390 82 395 91 C 397 94 399 95 400 98 C 401 95 403 94 405 91 C 410 82 405 77 400 68 Z" fill="#0077b6" />
    <!-- Left flame flick -->
    <path d="M 395 78 C 391 83 388 88 392 94 C 394 93 396 90 395 86 C 395 83 395 80 395 78 Z" fill="#0077b6" />
    <!-- Right flame flick -->
    <path d="M 405 78 C 409 83 412 88 408 94 C 406 93 404 90 405 86 C 405 83 405 80 405 78 Z" fill="#0077b6" />

    <!-- Torch cup -->
    <path d="M 392 99 L 408 99 L 405 106 L 395 106 Z" fill="#0077b6" />
    <!-- Torch handle -->
    <rect x="398" y="106" width="4" height="28" fill="#0077b6" />

    <!-- Wings on both sides of torch -->
    <!-- Left Wing -->
    <g fill="#0077b6">
      <path d="M 386 86 C 374 74 360 84 354 94 C 352 100 350 110 360 118 C 363 121 370 125 380 128 C 372 120 368 110 370 102 C 373 94 380 88 386 86 Z" />
      <path d="M 374 98 C 362 88 350 96 348 106 C 346 112 348 122 360 130 C 370 133 378 134 384 133 C 374 126 368 116 370 106 C 372 100 373 98 374 98 Z" opacity="0.9" />
    </g>
    <!-- Right Wing -->
    <g fill="#0077b6">
      <path d="M 414 86 C 426 74 440 84 446 94 C 448 100 450 110 440 118 C 437 121 430 125 420 128 C 428 120 432 110 430 102 C 427 94 420 88 414 86 Z" />
      <path d="M 426 98 C 438 88 450 96 452 106 C 454 112 452 122 440 130 C 430 133 422 134 416 133 C 426 126 432 116 430 106 C 428 100 427 98 426 98 Z" opacity="0.9" />
    </g>

    <!-- Ribbon Banner with ZEALOUS BROTHERS -->
    <path d="M 362 133 C 375 130 388 130 400 130 C 412 130 425 130 438 133 C 432 140 420 144 400 144 C 380 144 368 140 362 133 Z" fill="#0077b6" />
    <text x="400" y="139" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="5.8" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      ZEALOUS BROTHERS
    </text>

    <!-- Year: 1994 -->
    <text x="400" y="152" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="7.5" font-weight="800" fill="#0077b6" text-anchor="middle" letter-spacing="1">
      1994
    </text>
  </g>

  <!-- 2. MAIN MALAYALAM TYPOGRAPHY: സെലസ് ബ്രദേഴ്‌സ് -->
  <g id="main-malayalam-typography">
    <!-- Left word: സെലസ് -->
    <text x="185" y="278" font-family="'Manjari', 'Gayathri', 'Noto Sans Malayalam', 'Anek Malayalam', sans-serif" font-size="104" font-weight="900" fill="#0077b6" letter-spacing="-1">
      സെലസ്
    </text>

    <!-- Right word: ബ്രദേഴ്‌സ് with the signature stylized bracket frame -->
    <text x="515" y="278" font-family="'Manjari', 'Gayathri', 'Noto Sans Malayalam', 'Anek Malayalam', sans-serif" font-size="104" font-weight="900" fill="#0077b6" letter-spacing="-1">
      ബ്രദേഴ്‌സ്
    </text>

    <!-- Stylized curved hook / bracket cradle extending under ബ്രദേഴ്‌സ് as in the original logo -->
    <path d="M 372 178 L 372 312 L 500 312" stroke="#0077b6" stroke-width="16" stroke-linecap="square" stroke-linejoin="round" fill="none" />
  </g>

  <!-- 3. SUBTITLES: കലാ സാംസ്കാരിക വേദി (Left) & പുതുപൊന്നാനി (Right) -->
  <g id="subtitles">
    <text x="245" y="348" font-family="'Manjari', 'Noto Sans Malayalam', sans-serif" font-size="28" font-weight="800" fill="#1e293b" text-anchor="middle">
      കലാ സാംസ്കാരിക വേദി
    </text>
    <text x="590" y="348" font-family="'Manjari', 'Noto Sans Malayalam', sans-serif" font-size="28" font-weight="800" fill="#1e293b" text-anchor="middle">
      പുതുപൊന്നാനി
    </text>
  </g>

  <!-- 4. BOTTOM REGISTRATION GRAY STRIP -->
  <g id="footer-registration-strip">
    <rect x="0" y="395" width="800" height="55" fill="#78716c" />
    
    <!-- Estd: 1994 -->
    <text x="75" y="430" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="19" font-weight="600" fill="#FFFFFF" letter-spacing="1">
      Estd: 1994
    </text>

    <!-- Govt. Reg. No. 126/95 -->
    <text x="400" y="430" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">
      Govt. Reg. No. 126/95
    </text>

    <!-- Aff. NYK. No. 429/96 -->
    <text x="725" y="430" font-family="'Plus Jakarta Sans', Arial, sans-serif" font-size="19" font-weight="600" fill="#FFFFFF" text-anchor="end" letter-spacing="1">
      Aff. NYK. No. 429/96
    </text>
  </g>
</svg>
